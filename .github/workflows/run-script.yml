name: Run Script on VPS

# Manual trigger only - for running one-time scripts
on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script to run (e.g., migrate-to-unified-delivery)"
        required: true
        type: choice
        options:
          - migrate-to-unified-delivery
          - db-migrate
          - db-migrate-custom
          - health-check
      dry_run:
        description: "Run in dry-run mode (preview only)"
        required: false
        default: true
        type: boolean
      tenant_id:
        description: "Tenant ID (optional, for tenant-specific migrations)"
        required: false
        type: string

jobs:
  run-script:
    name: Run Script
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Validate inputs
        run: |
          echo "🔧 Script: ${{ github.event.inputs.script }}"
          echo "📋 Dry run: ${{ github.event.inputs.dry_run }}"
          if [ -n "${{ github.event.inputs.tenant_id }}" ]; then
            echo "🏪 Tenant: ${{ github.event.inputs.tenant_id }}"
          fi

      - name: Run script on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /var/www/kakamalem

            echo "=================================================="
            echo "Running: ${{ github.event.inputs.script }}"
            echo "=================================================="

            case "${{ github.event.inputs.script }}" in
              "migrate-to-unified-delivery")
                ARGS=""
                if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
                  ARGS="$ARGS --dry-run"
                fi
                if [ -n "${{ github.event.inputs.tenant_id }}" ]; then
                  ARGS="$ARGS --tenant-id=${{ github.event.inputs.tenant_id }}"
                fi
                echo "Running: npx tsx scripts/migrate-to-unified-delivery.ts $ARGS"
                npx tsx scripts/migrate-to-unified-delivery.ts $ARGS
                ;;

              "db-migrate")
                echo "Running Drizzle schema migrations..."
                pnpm db:migrate
                ;;

              "db-migrate-custom")
                echo "Running custom SQL migrations..."
                pnpm db:migrate:custom
                ;;

              "health-check")
                echo "Running health check..."
                bash scripts/health-check.sh
                ;;

              *)
                echo "❌ Unknown script: ${{ github.event.inputs.script }}"
                exit 1
                ;;
            esac

            echo ""
            echo "✅ Script completed successfully!"

      - name: Report status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Script '${{ github.event.inputs.script }}' completed successfully"
          else
            echo "❌ Script '${{ github.event.inputs.script }}' failed"
            exit 1
          fi
