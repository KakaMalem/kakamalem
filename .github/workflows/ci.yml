name: CI - Lint and Type Check

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres: [16, 18]

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: hesabpay_test
          POSTGRES_PASSWORD: isolated-test-password
          POSTGRES_DB: kakamalem_hesabpay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hesabpay_test -d kakamalem_hesabpay_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: HesabPay unit tests (no network or email)
        run: pnpm test:hesabpay

      - name: HesabPay PostgreSQL integration tests
        run: pnpm test:hesabpay:integration
        env:
          HESABPAY_TEST_DATABASE_URL: postgresql://hesabpay_test:isolated-test-password@127.0.0.1:5432/kakamalem_hesabpay_test

      - name: Build check
        run: pnpm build
        env:
          # Use dummy values for build-time checks
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
          DATABASE_URL_UNPOOLED: postgresql://dummy:dummy@localhost:5432/dummy
          BETTER_AUTH_SECRET: dummy-secret-for-ci-build-at-least-32-chars
          NEXT_PUBLIC_APP_URL: http://localhost:3000
