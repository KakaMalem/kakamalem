# =============================================================================
# PostgreSQL 18 Configuration for Kaka Malem
# =============================================================================
# Optimized for: 2 dedicated + 2 shared cores, 16GB DDR4 RAM, 75GB NVMe
# =============================================================================

# -----------------------------------------------------------------------------
# DATA DIRECTORY (CRITICAL - DO NOT REMOVE)
# -----------------------------------------------------------------------------
data_directory = '/var/lib/postgresql/18/main'
hba_file = '/etc/postgresql/18/main/pg_hba.conf'
ident_file = '/etc/postgresql/18/main/pg_ident.conf'
external_pid_file = '/var/run/postgresql/18-main.pid'

# -----------------------------------------------------------------------------
# CONNECTION SETTINGS
# -----------------------------------------------------------------------------
# PgBouncer handles external connections on 6543, PostgreSQL listens internally
listen_addresses = '127.0.0.1'
port = 5432
max_connections = 100                    # Low because PgBouncer pools connections
superuser_reserved_connections = 3

# Unix socket for local connections (faster than TCP)
unix_socket_directories = '/var/run/postgresql'

# -----------------------------------------------------------------------------
# MEMORY CONFIGURATION (16GB RAM)
# -----------------------------------------------------------------------------
# shared_buffers: 25% of RAM for database cache
shared_buffers = 4GB

# effective_cache_size: 75% of RAM (tells planner about OS cache)
effective_cache_size = 12GB

# work_mem: Memory per sort/hash operation (careful - multiplied by connections)
# With PgBouncer limiting connections, we can be generous
work_mem = 128MB

# maintenance_work_mem: For VACUUM, CREATE INDEX, etc.
maintenance_work_mem = 1GB

# huge_pages: Use huge pages for shared memory (reduces TLB misses)
huge_pages = try

# -----------------------------------------------------------------------------
# WAL (Write-Ahead Log) CONFIGURATION
# -----------------------------------------------------------------------------
# wal_buffers: WAL buffer size (auto-tuned from shared_buffers, but set explicitly)
wal_buffers = 64MB

# checkpoint_completion_target: Spread checkpoint I/O over this fraction of interval
checkpoint_completion_target = 0.9

# wal_compression: Compress WAL (reduces I/O, minimal CPU cost on modern CPUs)
wal_compression = zstd

# max_wal_size: Maximum WAL size before checkpoint
max_wal_size = 4GB

# min_wal_size: Minimum WAL to retain
min_wal_size = 1GB

# wal_level: Required for replication and point-in-time recovery
wal_level = replica

# -----------------------------------------------------------------------------
# ASYNC I/O & NVMe OPTIMIZATION (PostgreSQL 18 Features)
# -----------------------------------------------------------------------------
# io_method: Use io_uring for async I/O (Linux 5.1+, major PostgreSQL 18 feature)
# Verified: /proc/sys/kernel/io_uring_disabled = 0
io_method = io_uring

# io_combine_limit: Combine adjacent I/O operations (NVMe handles this well)
io_combine_limit = 128kB

# effective_io_concurrency: High value for NVMe (handles many concurrent I/Os)
effective_io_concurrency = 200

# maintenance_io_concurrency: For VACUUM, CREATE INDEX
maintenance_io_concurrency = 100

# random_page_cost: Low for NVMe (random reads nearly as fast as sequential)
random_page_cost = 1.1

# seq_page_cost: Sequential page cost (baseline)
seq_page_cost = 1.0

# -----------------------------------------------------------------------------
# PARALLEL QUERY CONFIGURATION
# -----------------------------------------------------------------------------
# max_parallel_workers_per_gather: Workers per parallel query
# 2 dedicated cores, so 2 parallel workers is reasonable
max_parallel_workers_per_gather = 2

# max_parallel_workers: Total parallel workers
max_parallel_workers = 4

# max_parallel_maintenance_workers: For parallel CREATE INDEX, VACUUM
max_parallel_maintenance_workers = 2

# parallel_leader_participation: Leader also does work
parallel_leader_participation = on

# min_parallel_table_scan_size: Minimum table size for parallel scan
min_parallel_table_scan_size = 8MB

# min_parallel_index_scan_size: Minimum index size for parallel scan
min_parallel_index_scan_size = 512kB

# -----------------------------------------------------------------------------
# QUERY PLANNING
# -----------------------------------------------------------------------------
# Enable JIT compilation for complex queries
jit = on
jit_above_cost = 100000
jit_inline_above_cost = 500000
jit_optimize_above_cost = 500000

# default_statistics_target: More accurate statistics for better plans
default_statistics_target = 200

# enable_partitionwise_join: Better for partitioned tables
enable_partitionwise_join = on
enable_partitionwise_aggregate = on

# -----------------------------------------------------------------------------
# AUTOVACUUM CONFIGURATION
# -----------------------------------------------------------------------------
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s
autovacuum_vacuum_threshold = 50
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_threshold = 50
autovacuum_analyze_scale_factor = 0.025
autovacuum_vacuum_cost_delay = 2ms
autovacuum_vacuum_cost_limit = 1000

# -----------------------------------------------------------------------------
# BACKGROUND WRITER
# -----------------------------------------------------------------------------
bgwriter_delay = 50ms
bgwriter_lru_maxpages = 400
bgwriter_lru_multiplier = 4.0
bgwriter_flush_after = 512kB

# -----------------------------------------------------------------------------
# LOGGING
# -----------------------------------------------------------------------------
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_min_duration_statement = 1000        # Log queries > 1 second
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 1000

# Log statement types
log_statement = 'ddl'                    # Log DDL statements

# -----------------------------------------------------------------------------
# STATISTICS & MONITORING
# -----------------------------------------------------------------------------
track_activities = on
track_counts = on
track_io_timing = on
track_wal_io_timing = on
track_functions = all

# pg_stat_statements - DISABLED until extension is installed
# To enable:
# 1. sudo apt install postgresql-18-pg-stat-statements (or postgresql-contrib)
# 2. Uncomment the lines below
# 3. Restart PostgreSQL
# 4. Run: CREATE EXTENSION pg_stat_statements;
#
# shared_preload_libraries = 'pg_stat_statements'
# pg_stat_statements.max = 10000
# pg_stat_statements.track = all

# -----------------------------------------------------------------------------
# SECURITY
# -----------------------------------------------------------------------------
password_encryption = scram-sha-256

# SSL - DISABLED (internal connections only via PgBouncer on localhost)
# PgBouncer handles external SSL if needed
# To enable SSL:
# 1. Generate certs: sudo -u postgres openssl req -new -x509 -days 365 -nodes -text -out server.crt -keyout server.key -subj "/CN=kakamalem-db"
# 2. Move to: /etc/postgresql/18/main/
# 3. Set permissions: chmod 600 server.key && chown postgres:postgres server.*
# 4. Uncomment the lines below
#
# ssl = on
# ssl_cert_file = '/etc/postgresql/18/main/server.crt'
# ssl_key_file = '/etc/postgresql/18/main/server.key'
# ssl_prefer_server_ciphers = on
# ssl_min_protocol_version = 'TLSv1.2'

# -----------------------------------------------------------------------------
# LOCALE & ENCODING
# -----------------------------------------------------------------------------
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'
default_text_search_config = 'pg_catalog.english'

# -----------------------------------------------------------------------------
# CLIENT CONNECTION DEFAULTS
# -----------------------------------------------------------------------------
timezone = 'UTC'
datestyle = 'iso, mdy'
intervalstyle = 'postgres'
