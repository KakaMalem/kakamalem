# =============================================================================
# Nginx Custom Domain Support - HTTP ACME Challenge Proxy
# =============================================================================
# Location: /etc/nginx/sites-available/kakamalem-custom
# Enable:   sudo ln -s /etc/nginx/sites-available/kakamalem-custom /etc/nginx/sites-enabled/
# Reload:   sudo nginx -t && sudo systemctl reload nginx
#
# Note: HTTPS for custom domains is handled by TLS passthrough via the
# stream module (see nginx-tls-passthrough.conf). This file only handles
# HTTP port 80 for ACME challenges and HTTPS redirects.
#
# Prerequisites:
#   1. Caddy must be running on port 8080 for HTTP (ACME challenges)
#   2. TLS passthrough must be configured (see nginx-tls-passthrough.conf)
# =============================================================================

# HTTP catch-all: proxy ACME challenges to Caddy, redirect everything else
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Pass ACME HTTP-01 challenges to Caddy (required for SSL provisioning)
    location /.well-known/acme-challenge/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
