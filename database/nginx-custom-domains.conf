# =============================================================================
# Nginx Catch-All for Custom Domains → Caddy
# =============================================================================
# Location: /etc/nginx/sites-available/kakamalem-custom
# Enable:   sudo ln -s /etc/nginx/sites-available/kakamalem-custom /etc/nginx/sites-enabled/
# Reload:   sudo nginx -t && sudo systemctl reload nginx
#
# Prerequisites:
#   1. Generate fallback self-signed cert:
#      sudo mkdir -p /etc/nginx/ssl
#      sudo openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \
#        -keyout /etc/nginx/ssl/fallback-key.pem \
#        -out /etc/nginx/ssl/fallback.pem \
#        -subj "/CN=fallback"
#
#   2. Ensure the main kakamalem.com server block does NOT use default_server
#
#   3. Caddy must be running on port 8443 (see Caddyfile)
# =============================================================================

# Catch-all: any domain that doesn't match kakamalem.com
# Forwards to Caddy which handles TLS for custom domains
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    # Self-signed fallback cert (Caddy handles the real certs)
    ssl_certificate /etc/nginx/ssl/fallback.pem;
    ssl_certificate_key /etc/nginx/ssl/fallback-key.pem;

    location / {
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# HTTP catch-all: redirect custom domains to HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    location / {
        return 301 https://$host$request_uri;
    }
}
