# =============================================================================
# Nginx Stream Module - TLS Passthrough for Custom Domains
# =============================================================================
# Location: /etc/nginx/stream.d/kakamalem-tls.conf
# Reload:   sudo nginx -t && sudo systemctl reload nginx
#
# This uses SNI (Server Name Indication) to route TLS connections:
#   - kakamalem.com / www.kakamalem.com → Nginx internal HTTPS (port 8444)
#   - All other domains → Caddy (port 8443) for on-demand TLS
#
# Prerequisites:
#   1. Install stream module: sudo apt install libnginx-mod-stream
#   2. Create directory: sudo mkdir -p /etc/nginx/stream.d
#   3. Add to /etc/nginx/nginx.conf (at bottom, outside http block):
#        stream {
#            include /etc/nginx/stream.d/*.conf;
#        }
#   4. Change main kakamalem.com server block from listen 443 → listen 8444
#   5. Remove the HTTPS catch-all from kakamalem-custom (nginx-custom-domains.conf)
#
# Why TLS passthrough?
#   Without it, Nginx terminates TLS on port 443 with a self-signed fallback
#   cert, then proxies to Caddy. The browser sees the self-signed cert ("Not
#   Secure") instead of Caddy's Let's Encrypt cert. TLS passthrough forwards
#   the raw TLS connection to Caddy so the browser negotiates directly with
#   Caddy's valid certificate.
# =============================================================================

# Route by SNI (domain name in TLS ClientHello)
map $ssl_preread_server_name $tls_backend {
    kakamalem.com       nginx_internal;
    www.kakamalem.com   nginx_internal;
    default             caddy_tls;
}

# Nginx handles kakamalem.com on internal port 8444
upstream nginx_internal {
    server 127.0.0.1:8444;
}

# Caddy handles custom domains on port 8443 (on-demand TLS)
upstream caddy_tls {
    server 127.0.0.1:8443;
}

# Listen on port 443 and forward based on SNI
server {
    listen 443;
    listen [::]:443;
    proxy_pass $tls_backend;
    ssl_preread on;
}
