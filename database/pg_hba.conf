# =============================================================================
# PostgreSQL Client Authentication Configuration
# =============================================================================
# TYPE  DATABASE        USER            ADDRESS                 METHOD

# -----------------------------------------------------------------------------
# Local connections (Unix socket)
# -----------------------------------------------------------------------------
# "local" is for Unix domain socket connections only
local   all             postgres                                peer
local   all             all                                     scram-sha-256

# -----------------------------------------------------------------------------
# IPv4 local connections (from PgBouncer)
# -----------------------------------------------------------------------------
# PgBouncer connects from localhost
host    kakamalem       kakamalem_app   127.0.0.1/32            scram-sha-256
host    kakamalem       kakamalem_migrations 127.0.0.1/32       scram-sha-256
host    kakamalem       kakamalem_readonly 127.0.0.1/32         scram-sha-256

# PgBouncer auth_query user
host    all             pgbouncer       127.0.0.1/32            scram-sha-256

# Replication user (for backups and streaming replication)
host    replication     replication     127.0.0.1/32            scram-sha-256

# -----------------------------------------------------------------------------
# IPv6 local connections
# -----------------------------------------------------------------------------
host    kakamalem       kakamalem_app   ::1/128                 scram-sha-256
host    kakamalem       kakamalem_migrations ::1/128            scram-sha-256
host    all             pgbouncer       ::1/128                 scram-sha-256

# -----------------------------------------------------------------------------
# External connections (if needed - usually blocked by firewall)
# -----------------------------------------------------------------------------
# IMPORTANT: Only enable these if you have proper firewall rules!
# host    kakamalem       kakamalem_app   0.0.0.0/0               scram-sha-256

# -----------------------------------------------------------------------------
# Reject all other connections
# -----------------------------------------------------------------------------
host    all             all             0.0.0.0/0               reject
host    all             all             ::/0                    reject
