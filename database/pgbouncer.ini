;; =============================================================================
;; PgBouncer Configuration for Kaka Malem
;; =============================================================================
;; Connection pooler - handles external connections on port 6543
;; Forwards to PostgreSQL on localhost:5432
;; =============================================================================

[databases]
;; Database connection strings
;; Format: dbname = host=... port=... dbname=...

;; Main application database
kakamalem = host=127.0.0.1 port=5432 dbname=kakamalem

;; Optional: Read replica for analytics (if you add one later)
;; kakamalem_readonly = host=replica.internal port=5432 dbname=kakamalem

[pgbouncer]
;; -----------------------------------------------------------------------------
;; LISTEN CONFIGURATION
;; -----------------------------------------------------------------------------
;; External connections come here
listen_addr = *
listen_port = 6543

;; Unix socket for local admin connections
unix_socket_dir = /var/run/pgbouncer

;; -----------------------------------------------------------------------------
;; AUTHENTICATION
;; -----------------------------------------------------------------------------
;; Authentication file (generated from PostgreSQL)
auth_file = /etc/pgbouncer/userlist.txt

;; Use PostgreSQL's scram-sha-256
auth_type = scram-sha-256

;; Query to check user credentials against PostgreSQL
auth_query = SELECT username, password FROM pgbouncer.user_lookup($1)

;; -----------------------------------------------------------------------------
;; POOLING MODE
;; -----------------------------------------------------------------------------
;; transaction: Return connection after transaction (best for web apps)
;; session: Return connection after client disconnects
;; statement: Return connection after each statement (dangerous with transactions)
pool_mode = transaction

;; -----------------------------------------------------------------------------
;; CONNECTION LIMITS
;; -----------------------------------------------------------------------------
;; Max client connections to PgBouncer
max_client_conn = 1000

;; Default pool size per user/database pair
default_pool_size = 25

;; Minimum pool size (keep connections warm)
min_pool_size = 5

;; Reserve pool for "burst" traffic
reserve_pool_size = 10
reserve_pool_timeout = 3

;; Max connections to PostgreSQL per pool
max_db_connections = 50

;; Max connections per user across all pools
max_user_connections = 100

;; -----------------------------------------------------------------------------
;; TIMEOUTS
;; -----------------------------------------------------------------------------
;; Time to wait for connection from pool
server_connect_timeout = 5

;; Time to wait for login response
server_login_retry = 3

;; Close server connection after being idle this long
server_idle_timeout = 300

;; Close client connection after being idle this long (0 = disabled)
client_idle_timeout = 0

;; Timeout for client to complete login
client_login_timeout = 60

;; How long to wait for query response
query_timeout = 300

;; How long to wait for query cancellation
query_wait_timeout = 120

;; -----------------------------------------------------------------------------
;; PERFORMANCE TUNING
;; -----------------------------------------------------------------------------
;; Size of packet buffer (optimal for typical queries)
pkt_buf = 4096

;; TCP keepalive settings
tcp_keepalive = 1
tcp_keepidle = 30
tcp_keepintvl = 10
tcp_keepcnt = 3

;; Socket buffer sizes
tcp_socket_buffer = 0

;; DNS lookup cache time
dns_max_ttl = 300
dns_nxdomain_ttl = 15

;; -----------------------------------------------------------------------------
;; TLS/SSL
;; -----------------------------------------------------------------------------
;; TLS disabled for local Docker-to-host connections
;; Enable if exposing PgBouncer externally
;; client_tls_sslmode = prefer
;; client_tls_key_file = /etc/pgbouncer/server.key
;; client_tls_cert_file = /etc/pgbouncer/server.crt
;; server_tls_sslmode = prefer

;; -----------------------------------------------------------------------------
;; LOGGING
;; -----------------------------------------------------------------------------
;; Log file location
logfile = /var/log/pgbouncer/pgbouncer.log

;; Log level: debug, info, notice, warning, error
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1

;; Stats logging interval (seconds)
stats_period = 60

;; Verbose logging (for debugging)
verbose = 0

;; -----------------------------------------------------------------------------
;; ADMIN CONSOLE
;; -----------------------------------------------------------------------------
;; Admin users can connect to pgbouncer database for management
admin_users = pgbouncer_admin

;; Users who can view stats
stats_users = pgbouncer_stats, pgbouncer_admin

;; Ignore startup parameters from clients
ignore_startup_parameters = extra_float_digits, search_path

;; Application name prefix for connections
application_name_add_host = 1

;; -----------------------------------------------------------------------------
;; PREPARED STATEMENTS (PostgreSQL 18 async improvements)
;; -----------------------------------------------------------------------------
;; Max prepared statements per server connection
max_prepared_statements = 100
