# =============================================================================
# Nginx Rate Limiting Zones for Kaka Malem
# =============================================================================
# Location: /etc/nginx/conf.d/rate-limits.conf
# This file must be included in the http {} block (conf.d/ is auto-included)
# =============================================================================

# Rate limiting zones
# - general: 10 requests/second for normal pages
# - auth: 5 requests/minute for login/signup (brute force protection)
# - api: 30 requests/second for API endpoints

limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

# Connection limiting zone
# - addr: max 20 concurrent connections per IP

limit_conn_zone $binary_remote_addr zone=addr:10m;
