# =============================================================================
# Nginx configuration for Kaka Malem
# =============================================================================
# Location: /etc/nginx/sites-available/kakamalem
# After changes: sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

# -----------------------------------------------------------------------------
# Rate Limiting Zones (must be in http block - add to /etc/nginx/nginx.conf)
# -----------------------------------------------------------------------------
# Add these lines to /etc/nginx/nginx.conf inside the http {} block:
#
# # Rate limiting zones
# limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
# limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
# limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
# limit_conn_zone $binary_remote_addr zone=addr:10m;
#
# -----------------------------------------------------------------------------

# HTTP server - redirects to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name kakamalem.com www.kakamalem.com;

    # Let's Encrypt challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP requests to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server - main application
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kakamalem.com www.kakamalem.com;

    # SSL certificates (added by Certbot)
    ssl_certificate /etc/letsencrypt/live/kakamalem.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kakamalem.com/privkey.pem;

    # SSL configuration - modern settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Client max body size (for image uploads)
    client_max_body_size 20M;

    # Timeouts
    proxy_read_timeout 60s;
    proxy_connect_timeout 60s;
    send_timeout 60s;

    # Buffer sizes (optimized for typical traffic)
    client_body_buffer_size 64k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;

    # Connection limits
    limit_conn addr 20;

    # =========================================================================
    # Auth routes - strict rate limiting (5 requests/minute)
    # =========================================================================
    location /api/auth/ {
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;

        # Larger buffers for auth cookies
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # =========================================================================
    # API routes - moderate rate limiting (30 requests/second)
    # =========================================================================
    location /api/ {
        limit_req zone=api burst=50 nodelay;
        limit_req_status 429;

        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;

        proxy_buffer_size 64k;
        proxy_buffers 4 128k;
        proxy_busy_buffers_size 128k;
    }

    # =========================================================================
    # Health check endpoint - no rate limiting
    # =========================================================================
    location /api/health {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # =========================================================================
    # Static files - Next.js immutable assets (1 year cache)
    # =========================================================================
    location /_next/static/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # =========================================================================
    # Public folder - static assets (30 day cache)
    # =========================================================================
    location /public/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        expires 30d;
        add_header Cache-Control "public";
    }

    # =========================================================================
    # Uploads - served by Next.js API route
    # =========================================================================
    location /uploads/ {
        limit_req zone=general burst=20 nodelay;

        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Cache uploaded images
        expires 7d;
        add_header Cache-Control "public";
    }

    # =========================================================================
    # Default - all other routes (10 requests/second)
    # =========================================================================
    location / {
        limit_req zone=general burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;

        # WebSocket support (for Next.js HMR if needed)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Critical for cookies (better-auth)
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;

        # Disable caching for auth routes
        proxy_cache_bypass $http_upgrade;
        proxy_no_cache $http_pragma $http_authorization;

        # Standard buffering
        proxy_buffering on;
        proxy_buffer_size 64k;
        proxy_buffers 4 128k;
        proxy_busy_buffers_size 128k;
    }

    # =========================================================================
    # Gzip compression
    # =========================================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_disable "msie6";
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/rss+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject
        image/svg+xml;

    # =========================================================================
    # Logging
    # =========================================================================
    access_log /var/log/nginx/kakamalem_access.log;
    error_log /var/log/nginx/kakamalem_error.log warn;

    # =========================================================================
    # Block common attack patterns
    # =========================================================================
    # Block access to hidden files
    location ~ /\. {
        deny all;
        return 404;
    }

    # Block access to backup files
    location ~ ~$ {
        deny all;
        return 404;
    }

    # Return 429 for rate-limited requests
    error_page 429 @rate_limit;
    location @rate_limit {
        add_header Content-Type application/json always;
        return 429 '{"error": "Too many requests. Please slow down."}';
    }
}
