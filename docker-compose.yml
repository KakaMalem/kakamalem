# =============================================================================
# Kaka Malem - Docker Compose (Blue-Green Deployment)
# =============================================================================
# This file orchestrates the Next.js app with zero-downtime deployments.
# PostgreSQL, PgBouncer, and Nginx run NATIVE on the host for performance.
#
# Blue-Green Strategy:
#   - app-blue runs on port 3000
#   - app-green runs on port 3001
#   - Nginx upstream switches between them during deployment
#   - Only one container is "active" at a time, but both can run during transition
#
# Usage:
#   docker compose up -d app-blue   # Start blue
#   docker compose up -d app-green  # Start green
#   docker compose down             # Stop all
# =============================================================================

# Shared configuration for both blue and green
x-app-common: &app-common
  build:
    context: .
    dockerfile: Dockerfile
    args:
      NEXT_PUBLIC_APP_URL: https://kakamalem.com
      NEXT_PUBLIC_SITE_URL: https://kakamalem.com
      NEXT_PUBLIC_APP_DOMAIN: kakamalem.com
      NEXT_PUBLIC_UPLOADS_URL: /uploads
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
  restart: unless-stopped
  network_mode: host
  env_file:
    - .env
  volumes:
    - /var/www/kakamalem-uploads:/var/www/kakamalem-uploads:rw
    - /tmp/kakamalem-uploads:/tmp/kakamalem-uploads:rw
  deploy:
    resources:
      limits:
        cpus: "3.0"
        memory: 10G
      reservations:
        cpus: "1.0"
        memory: 2G
  logging:
    driver: "json-file"
    options:
      max-size: "50m"
      max-file: "5"

services:
  # =========================================================================
  # Blue instance (port 3000)
  # =========================================================================
  app-blue:
    <<: *app-common
    container_name: kakamalem-blue
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NODE_OPTIONS=--max-old-space-size=6144
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # =========================================================================
  # Green instance (port 3001)
  # =========================================================================
  app-green:
    <<: *app-common
    container_name: kakamalem-green
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOSTNAME=0.0.0.0
      - NODE_OPTIONS=--max-old-space-size=6144
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# =============================================================================
# Notes:
# =============================================================================
#
# Why PostgreSQL/PgBouncer/Nginx are NOT in this compose file:
# - PostgreSQL: Better performance native, easier backup/restore
# - PgBouncer: Minimal overhead native, simpler config
# - Nginx: Native handles SSL termination, static files faster
#
# To migrate to a new server:
# 1. Copy this file and .env to new server
# 2. Set up PostgreSQL/PgBouncer/Nginx natively (use server-setup/install.sh)
# 3. docker compose build && docker compose up -d
# 4. Done!
# =============================================================================
